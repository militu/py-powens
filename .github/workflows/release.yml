name: Release

# Started by a version tag. The gate already passed on the pull request and on
# main: the tag is checked against the package version, the distributions are
# built once, published to PyPI (Trusted Publisher, OIDC) and attached to a
# GitHub release.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools of mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          cache: false # a published artifact is built without cache (cache poisoning)

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/powens/__init__.py').read_text()).group(1))")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match src/powens/__init__.py version $PKG"
            exit 1
          fi

      - name: Build and check the distributions
        run: |
          uv build
          uv tool run twine check dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher, OIDC)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/py-powens/
    permissions:
      id-token: write # OIDC token for the PyPI Trusted Publisher
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub release
    needs: publish-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create the release with the distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --generate-notes --verify-tag "${prerelease[@]}" --repo "$GITHUB_REPOSITORY"

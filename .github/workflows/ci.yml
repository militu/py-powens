name: CI

# Public repository: it cannot call the private militu/ci, so it runs the same
# gate inline. One job: workflow lint, secret scan, tools from mise.toml, `make ci`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# A newer push to the same pull request replaces its run; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "1.7.12"
  # renovate: datasource=github-releases depName=zizmorcore/zizmor
  ZIZMOR_VERSION: "1.30.1"
  # renovate: datasource=github-releases depName=gitleaks/gitleaks
  GITLEAKS_VERSION: "8.30.1"
  # renovate: datasource=github-releases depName=koalaman/shellcheck
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out the repository (full history, for the secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the tools of mise.toml
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          cache: true

      - name: Restore the package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Lint the workflows (actionlint, zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise x "actionlint@$ACTIONLINT_VERSION" "shellcheck@$SHELLCHECK_VERSION" -- actionlint
          mise x "zizmor@$ZIZMOR_VERSION" -- zizmor --format github --min-severity medium .github/workflows

      - name: Scan for secrets (gitleaks)
        run: |
          range=()
          if [ -n "$CI_BASE" ] && [ "${CI_BASE#0000000}" = "$CI_BASE" ]; then range=(--log-opts="$CI_BASE..HEAD"); fi
          mise x "gitleaks@$GITLEAKS_VERSION" -- gitleaks git --redact --no-banner "${range[@]}" .

      - name: make ci
        run: make ci

      - name: Keep only what is worth caching
        if: ${{ always() }}
        run: uv cache prune --ci
